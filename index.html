<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ce date oferă Departamentul Tehnic celorlalte departamente – proiect de curs. Date exemplificative.">
<meta name="robots" content="noindex">
<title>ELIT Date Tehnice</title>
<link rel="icon" href="assets/logo-elit.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="demo-banner">Proiect de curs „Maparea Legăturilor Structurale”. Date exemplificative; nu este un sistem oficial ELIT.</div>
<header class="topbar">
  <div class="brand">
    <img class="logo" src="assets/logo-elit.png" alt="Elit">
    <div>
      <div class="brand-title">Departament Tehnic</div>
      <div class="brand-sub" id="siteName">Ce date oferim celorlalte departamente</div>
    </div>
  </div>
  <div class="kpis" id="topKpis"></div>
  <div class="clock" id="clock"></div>
  <button class="theme-btn" id="themeBtn" title="Temă luminoasă / întunecată" aria-label="Schimbă tema">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/></svg>
  </button>
</header>

<nav class="tabs" id="tabs">
  <button data-view="cereri" class="tab-cta active">Departamente</button>
  <button data-view="flux">Flux informațional</button>
  <button data-view="harta">Harta halei</button>
  <button data-view="capacitate">Producție & capacitate</button>
  <button data-view="mentenanta">Mentenanță & KPI</button>
</nav>
<div class="quickdeps" id="quickDeps"></div>

<main>
  <section class="view active" id="view-cereri"></section>
  <section class="view" id="view-flux"></section>
  <section class="view" id="view-harta"></section>
  <section class="view" id="view-capacitate"></section>
  <section class="view" id="view-mentenanta"></section>
</main>

<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script src="js/view-harta.js"></script>
<script src="js/view-mentenanta.js"></script>
<script src="js/view-flux.js"></script>
<script src="js/exemple.js"></script>
<script src="js/view-cereri.js"></script>
<script src="js/view-capacitate.js"></script>
<script src="js/ghid.js"></script>
</body>
</html>
